plugins {
    id 'java'
    id 'application'
}

group = 'com.ticketflow'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Functional style — the manager returns Either<Failure, T>, no nulls, no unchecked business exceptions.
    implementation 'io.vavr:vavr:0.10.4'

    // Readability / format style — cuts boilerplate on immutable value classes. @Data / @Setter / @SneakyThrows are banned project-wide.
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.ticketflow.Main'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:all' << '-Xlint:-processing' << '-Werror'
}

tasks.named('run') {
    standardInput = System.in
}
